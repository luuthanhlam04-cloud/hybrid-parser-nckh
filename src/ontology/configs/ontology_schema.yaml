version: "1.3"
classes:
  - LEGAL_SUBJECT
  - LEGAL_ACTION
  - CONDITION
  - EXCEPTION
  - PENALTY
  - LEGAL_DOCUMENT_REF
  - LEGAL_OBJECT

relations:
  ALLOW:
    domain: ["LEGAL_SUBJECT"]
    range: ["LEGAL_ACTION"]
    self_loop: false
  REQUIRE:
    domain: ["LEGAL_SUBJECT", "LEGAL_ACTION"]
    range: ["LEGAL_ACTION"]
    self_loop: false
  PROHIBIT:
    domain: ["LEGAL_SUBJECT"]
    range: ["LEGAL_ACTION"]
    self_loop: false
  HAS_CONDITION:
    domain: ["LEGAL_SUBJECT", "LEGAL_ACTION"]
    range: ["CONDITION"]
    self_loop: true
    max_depth: 2
  HAS_EXCEPTION:
    domain: ["LEGAL_ACTION", "CONDITION"]
    range: ["EXCEPTION"]
    self_loop: true
    max_depth: 2
  REFERENCE_TO:
    domain: ["LEGAL_SUBJECT", "LEGAL_ACTION", "CONDITION", "EXCEPTION", "PENALTY", "LEGAL_DOCUMENT_REF"]
    range: ["LEGAL_DOCUMENT_REF"]
    self_loop: false
  HAS_PENALTY:
    domain: ["LEGAL_ACTION"]
    range: ["PENALTY"]
    self_loop: false
  HAS_OBJECT:
    domain: ["LEGAL_ACTION", "LEGAL_SUBJECT"]
    range: ["LEGAL_OBJECT", "LEGAL_SUBJECT"]
    self_loop: false
